proxy-groups:
  # 总入口：默认走故障转移，可手动切到自动选择或直连
  - name: 节点选择
    type: select
    proxies:
      - 故障转移
      - 自动选择
      - DIRECT
      - 全部节点
  # 自动选择：始终挑当前延迟最低的，2 分钟复测
  - name: 自动选择
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 120
    tolerance: 30
