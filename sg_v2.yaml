proxy-groups:
  # 总入口：默认走故障转移，可手动切到自动选择或直连
  - name: 节点选择
    type: select
    proxies:
      - 故障转移
      - 自动选择
      - DIRECT
      - 全部节点
  # 自动选择：始终挑当前延迟最低的，2 分钟复测
  - name: 自动选择
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 120
    tolerance: 30
    lazy: false
    proxies:
      - "SG03 211ms vless"
      - "SG04 212ms vless"
      - "SG08 267ms vless"
      - "SG11 343ms vless"
      - "SG12 424ms vmess"
      - "SG01 170ms http"
      - "SG02 176ms http"
      - "SG05 213ms http"
      - "SG06 218ms http"
      - "SG07 223ms http"
      - "SG09 269ms http"
      - "SG13 833ms http"
      - "SG14 835ms http"
      - "SG15 836ms http"
      - "SG16 1195ms http"
      - "SG10 282ms socks5"
  # 故障转移：按顺序试，第一个可用的就用，最稳
  - name: 故障转移
    type: fallback
    url: https://www.gstatic.com/generate_204
    interval: 120
    lazy: false
    proxies:
      - "SG03 211ms vless"
      - "SG04 212ms vless"
      - "SG08 267ms vless"
      - "SG11 343ms vless"
      - "SG12 424ms vmess"
      - "SG01 170ms http"
      - "SG02 176ms http"
      - "SG05 213ms http"
      - "SG06 218ms http"
      - "SG07 223ms http"
      - "SG09 269ms http"
      - "SG13 833ms http"
      - "SG14 835ms http"
      - "SG15 836ms http"
      - "SG16 1195ms http"
      - "SG10 282ms socks5"
      - DIRECT
  - name: 全部节点
    type: select
    proxies:
      - "SG03 211ms vless"
      - "SG04 212ms vless"
      - "SG08 267ms vless"
      - "SG11 343ms vless"
      - "SG12 424ms vmess"
      - "SG01 170ms http"
      - "SG02 176ms http"
      - "SG05 213ms http"
      - "SG06 218ms http"
      - "SG07 223ms http"
      - "SG09 269ms http"
      - "SG13 833ms http"
      - "SG14 835ms http"
      - "SG15 836ms http"
      - "SG16 1195ms http"
      - "SG10 282ms socks5"

rules:
  # 内网直连
  - DOMAIN-SUFFIX,local,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - GEOIP,PRIVATE,DIRECT,no-resolve
  # 国内流量直连 —— 这条是提速关键
  - GEOIP,CN,DIRECT
  # 其余走代理
  - MATCH,节点选择
