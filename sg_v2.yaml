proxy-groups:
  # 总入口：默认走故障转移，可手动切到自动选择或直连
  - name: 节点选择
    type: select
    proxies:
      - 故障转移
      - 自动选择
      - DIRECT
      - 全部节点
  # 自动选择：始终挑当前延迟最低的，2 分钟复测
  - name: 自动选择
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 120
    tolerance: 30
    lazy: false
    proxies:
      - "SG13 214ms vless"
      - "SG15 218ms vless"
      - "SG16 420ms vless"
      - "SG19 888ms vmess"
      - "SG01 166ms http"
      - "SG02 167ms http"
      - "SG03 170ms http"
      - "SG04 173ms http"
      - "SG05 176ms http"
      - "SG06 198ms http"
      - "SG07 200ms http"
      - "SG08 201ms http"
      - "SG09 201ms http"
      - "SG10 206ms http"
      - "SG11 208ms http"
      - "SG12 208ms http"
      - "SG14 216ms http"
      - "SG17 621ms http"
      - "SG18 647ms socks5"
  # 故障转移：按顺序试，第一个可用的就用，最稳
  - name: 故障转移
    type: fallback
    url: https://www.gstatic.com/generate_204
    interval: 120
    lazy: false
    proxies:
      - "SG13 214ms vless"
      - "SG15 218ms vless"
      - "SG16 420ms vless"
      - "SG19 888ms vmess"
      - "SG01 166ms http"
      - "SG02 167ms http"
