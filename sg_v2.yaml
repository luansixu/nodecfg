# ============================================================
# 新加坡节点订阅 v2
# 变更说明：
#   - 新增国内分流：CN 流量直连，不再绕道新加坡
#   - 新增故障转移组：节点挂掉自动切下一个
#   - 测速间隔 120s、容差 30ms：节点劣化后 2 分钟内被换掉
#   - DNS 走 fake-ip + 国内 DoH，减少解析耗时
# 节点数：19
# ============================================================
mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false
external-controller: 127.0.0.1:9097
unified-delay: true
tcp-concurrent: true

# GeoIP 数据从 jsDelivr 拉，避免手机从 GitHub 下载失败
geodata-mode: false
geo-auto-update: false
geox-url:
  geoip: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4

