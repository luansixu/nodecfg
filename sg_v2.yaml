      - "SG11 208ms http"
      - "SG12 208ms http"
      - "SG14 216ms http"
      - "SG17 621ms http"
      - "SG18 647ms socks5"
      - DIRECT
  - name: 全部节点
    type: select
    proxies:
      - "SG13 214ms vless"
      - "SG15 218ms vless"
      - "SG16 420ms vless"
      - "SG19 888ms vmess"
      - "SG01 166ms http"
      - "SG02 167ms http"
      - "SG03 170ms http"
